[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "user_review_sentiment_analysis_inst414"
version = "0.0.1"
description = "User Review Sentiment Analysis Model Exploration"
authors = [
  { name = "Peter Redding" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["user_review_sentiment_analysis_inst414"]
include = ["pyproject.toml", "user_review_sentiment_analysis_inst414/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["user_review_sentiment_analysis_inst414"]
force-sort-within-sections = true

